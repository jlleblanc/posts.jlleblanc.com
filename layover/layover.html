<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layover</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1a1a2e">
    <link rel="apple-touch-icon" href="icons/icon-192x192.png">
    <link rel="stylesheet" href="layover.css">
</head>
<body>

<!-- Title Screen -->
<div id="title-screen" class="screen active">
    <div class="game-logo">
        Layover
        <span class="sub">Find your connection</span>
    </div>
    <div id="char-list" class="char-list"></div>
    <button class="btn btn-primary" id="new-char-btn">New Character</button>
</div>

<!-- Character Creation Screen -->
<div id="create-screen" class="screen">
    <h2>Create Character</h2>
    <input type="text" id="char-name-input" class="name-input" placeholder="Enter name..." maxlength="20">
    <div>
        <p style="color:#888; font-size:13px; margin-bottom:8px;">Choose avatar</p>
        <div id="avatar-picker" class="avatar-picker"></div>
    </div>
    <div class="pref-section">
        <h3>Your Preferences</h3>
        <div id="pref-picker" class="pref-grid"></div>
    </div>
    <div style="display:flex; gap:12px; margin-top:12px;">
        <button class="btn btn-secondary" id="create-back-btn">Back</button>
        <button class="btn btn-primary" id="create-start-btn">Start</button>
    </div>
</div>

<!-- Main Game Screen -->
<div id="game-screen" class="screen">
    <div class="game-header">
        <div class="header-left">
            <div class="char-switcher" id="char-switcher">
                <span id="header-avatar"></span>
                <span id="header-name"></span>
                <span style="font-size:10px;">&#9660;</span>
                <div id="char-dropdown" class="char-dropdown"></div>
            </div>
        </div>
        <div class="header-right">
            <div class="credits-badge">
                <span>&#x1F4B3;</span>
                <span id="header-credits"></span>
            </div>
        </div>
    </div>

    <div class="game-body">
        <div class="location-bar" id="location-bar">
            <div>
                <div class="location-name">You are at</div>
                <div class="location-code" id="current-airport-code"></div>
            </div>
            <div class="game-time" id="game-time-display"></div>
        </div>

        <div id="lounge-banner" class="lounge-banner" style="display:none;"></div>

        <!-- Flights Tab -->
        <div id="flights-tab">
            <div style="display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap;">
                <button class="btn btn-wait btn-small" id="wait-btn">Wait 30 min</button>
                <button class="btn btn-secondary btn-small" id="wait-next-btn" title="Fast-forward to next departure">⏩ Next flight</button>
                <button class="btn btn-secondary btn-small" id="browse-men-btn">Browse Men</button>
            </div>
            <div class="section-title">Departing Flights — Next 24 Hours</div>
            <div id="flight-schedule" class="flight-schedule"></div>
        </div>

        <!-- Browse Tab -->
        <div id="browse-tab" style="display:none;">
            <div style="display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap;">
                <button class="btn btn-wait btn-small" id="wait-btn-browse">Wait 30 min</button>
                <button class="btn btn-secondary btn-small" id="wait-next-btn-browse" title="Fast-forward to next departure">⏩ Next flight</button>
            </div>
            <div class="filter-bar" id="filter-bar">
                <button class="filter-btn active" data-filter="here">At This Airport</button>
                <button class="filter-btn" data-filter="all">All Airports</button>
            </div>
            <div class="section-title" id="section-title">Men at this airport</div>
            <div id="profile-list" class="profile-list"></div>
            <div style="margin-top:16px;">
                <button class="btn btn-secondary btn-small" id="view-flights-btn">View Flights</button>
            </div>
        </div>

        <!-- Profile Tab (now inside game-body for correct scrolling/nav) -->
        <div id="profile-tab" style="display:none;">
            <div id="profile-content" class="profile-screen-content"></div>
        </div>
    </div>

    <div class="bottom-nav">
        <button class="nav-btn active" data-tab="flights">
            <span class="nav-icon">&#x2708;</span>
            Flights
        </button>
        <button class="nav-btn" data-tab="browse">
            <span class="nav-icon">&#x1F50D;</span>
            Browse
        </button>
        <button class="nav-btn" data-tab="profile">
            <span class="nav-icon">&#x1F464;</span>
            Profile
        </button>
    </div>
</div>

<!-- Encounter Screen -->
<div id="encounter-screen" class="screen">
    <div class="encounter-avatar" id="encounter-avatar"></div>
    <div class="encounter-name" id="encounter-name"></div>
    <div style="color:#888;" id="encounter-airport"></div>

    <div class="encounter-reveal">
        <div class="reveal-label">Compatibility</div>
        <div class="reveal-match" id="encounter-match"></div>
        <div class="reveal-label">full match revealed</div>
    </div>

    <div class="encounter-activities" id="encounter-activities"></div>

    <div class="encounter-reward" id="encounter-reward" style="display:none;">
        <div class="reward-text" id="reward-text"></div>
    </div>

    <button class="btn btn-primary" id="end-encounter-btn">Continue</button>
</div>

<!-- Arrival Screen -->
<div id="arrival-screen" class="screen">
    <div style="flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px; text-align:center;">
        <div id="arrival-icon" style="font-size:64px;">✈️</div>
        <div id="arrival-title" style="font-size:24px; font-weight:700;"></div>
        <div id="arrival-subtitle" style="color:#888;"></div>
        <div id="arrival-delay" class="delay-banner" style="display:none;"></div>
        <div id="arrival-newmen" style="display:none; max-width:360px; width:100%;">
            <div class="section-title" style="text-align:left;">New men at this airport:</div>
            <div id="arrival-men-list"></div>
        </div>
        <button class="btn btn-primary" id="end-arrival-btn" style="margin-top:16px;">Start Browsing</button>
    </div>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
